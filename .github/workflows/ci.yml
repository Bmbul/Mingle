name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore
        run: dotnet restore Mingle.slnx

      - name: Build
        run: dotnet build Mingle.slnx --configuration Release --no-restore -warnaserror

      - name: Test
        run: >
          dotnet test Mingle.slnx --configuration Release --no-build
          --logger "trx;LogFilePrefix=results"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      # Main (pushes and manual runs) publishes the image to GitHub Container Registry; pull requests only build it.
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ghcr.io/bmbul/mingle:${{ github.sha }}
            ghcr.io/bmbul/mingle:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Azure
    # Only for main (pushes and manual runs), after the build, the tests and the image all succeeded, once Azure is set up
    # (infra/azure-setup.sh stores the AZURE_* variables).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AZURE_CLIENT_ID != ''
    needs: [build-and-test, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      id-token: write # sign in to Azure with OIDC, no stored password
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Point the app at the new image
        run: >
          az containerapp update
          --name mingle-app --resource-group mingle-rg
          --image ghcr.io/bmbul/mingle:${{ github.sha }}
          --output none

      - name: Check the live app answers
        run: |
          url="https://$(az containerapp show --name mingle-app --resource-group mingle-rg --query properties.configuration.ingress.fqdn -o tsv)"
          for i in $(seq 1 30); do
            if curl -sf "$url/health" > /dev/null; then echo "Live: $url"; exit 0; fi
            sleep 10
          done
          echo "The app did not answer at $url/health" >&2
          exit 1
