# Local testing and development.
#   Everything (database + app), app on http://localhost:8080 and on your network at http://<this-computer's-ip>:8080:
#     docker compose up --build
#   Database only (then run the app with `dotnet run --project src/Mingle.API`):
#     docker compose up -d db
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mingle
      POSTGRES_USER: mingle
      # Local development only. Real deployments take the password from a secret store.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mingle_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mingle -d mingle"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      ConnectionStrings__Mingle: "Host=db;Port=5432;Database=mingle;Username=mingle;Password=${POSTGRES_PASSWORD:-mingle_dev}"
      # Optional: AI-written cards locally. Export the key in your shell before `docker compose up`.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
