# Local development.
#   Database only (then run the app with `dotnet run --project src/Mingle.Api`):
#     docker compose up -d db
#   Database and app together, app on http://localhost:8080:
#     docker compose --profile app up --build
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mingle
      POSTGRES_USER: mingle
      # Local development only. Real deployments take the password from a secret store.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mingle_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mingle -d mingle"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    profiles: ["app"]
    build: .
    environment:
      ConnectionStrings__Mingle: "Host=db;Port=5432;Database=mingle;Username=mingle;Password=${POSTGRES_PASSWORD:-mingle_dev}"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
