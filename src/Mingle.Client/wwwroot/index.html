<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#121216" />
    <title>Mingle</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script>
        // UI language: saved choice, else the browser's language. Changing it reloads the app.
        window.mingle = {
            getLang: function () {
                try {
                    var saved = localStorage.getItem('mingle.lang');
                    if (saved) return saved;
                } catch (e) { }
                return (navigator.language || 'en').slice(0, 2);
            },
            setLang: function (code) {
                try { localStorage.setItem('mingle.lang', code); } catch (e) { }
                location.reload();
            },
            // Last decks loaded from the server, for offline play.
            saveDecks: function (json) {
                try { localStorage.setItem('mingle.decks', json); } catch (e) { }
            },
            loadDecks: function () {
                try { return localStorage.getItem('mingle.decks'); } catch (e) { return null; }
            }
        };
        document.documentElement.lang = window.mingle.getLang();
    </script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">×</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
</body>

</html>
