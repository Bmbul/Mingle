<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#121216" />
    <title>Mingle</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script>
        // UI language: saved choice, else the browser's language. Changing it reloads the app.
        window.mingle = {
            getLang: function () {
                try {
                    var saved = localStorage.getItem('mingle.lang');
                    if (saved) return saved;
                } catch (e) { }
                return (navigator.language || 'en').slice(0, 2);
            },
            setLang: function (code) {
                try { localStorage.setItem('mingle.lang', code); } catch (e) { }
                location.reload();
            },
            // Last decks loaded from the server, for offline play.
            saveDecks: function (json) {
                try { localStorage.setItem('mingle.decks', json); } catch (e) { }
            },
            loadDecks: function () {
                try { return localStorage.getItem('mingle.decks'); } catch (e) { return null; }
            },
            get: function (key) {
                try { return localStorage.getItem(key); } catch (e) { return null; }
            },
            set: function (key, value) {
                try { localStorage.setItem(key, value); } catch (e) { }
            },
            remove: function (key) {
                try { localStorage.removeItem(key); } catch (e) { }
            },
            focus: function (id) { var el = document.getElementById(id); if (el) el.focus(); },
            // Shares a text (a finished story) through the phone's share sheet, or copies it.
            shareText: async function (text) {
                try {
                    if (navigator.share) { await navigator.share({ text: text }); return 'shared'; }
                    await navigator.clipboard.writeText(text);
                    return 'copied';
                } catch (e) { return 'failed'; }
            },
            // Screen size in CSS pixels (the blitz timer bar runs around the edge).
            viewport: function () { return [window.innerWidth, window.innerHeight]; },
            // End of a blitz turn: a short vibration and a beep, where the phone allows them.
            buzz: function () {
                try { if (navigator.vibrate) navigator.vibrate([120, 60, 120]); } catch (e) { }
                try {
                    var ctx = new (window.AudioContext || window.webkitAudioContext)();
                    var osc = ctx.createOscillator(), gain = ctx.createGain();
                    osc.frequency.value = 660; gain.gain.value = 0.15;
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.start(); osc.stop(ctx.currentTime + 0.25);
                } catch (e) { }
            },
            // Opens the phone's share sheet, or copies the link where there is none.
            share: async function (url, title) {
                try {
                    if (navigator.share) { await navigator.share({ title: title, url: url }); return 'shared'; }
                    await navigator.clipboard.writeText(url);
                    return 'copied';
                } catch (e) { return 'failed'; }
            }
        };
        document.documentElement.lang = window.mingle.getLang();
    </script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">×</span>
    </div>
    <script src="js/swipe.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        // When a new version takes over, reload once so the page runs it (not on the very first install).
        // Online seats rejoin after a reload; a pass-and-play game lives only in memory, so on /play
        // the new version waits until the next page load instead.
        if (navigator.serviceWorker.controller) {
            let reloaded = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (reloaded || location.pathname.endsWith('/play')) return;
                reloaded = true;
                location.reload();
            });
        }
        navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });
    </script>
</body>

</html>
